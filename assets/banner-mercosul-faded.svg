<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Placa Mercosul em destaque suave</title>
  <desc id="d">Ilustracao de placa Mercosul com fundo escuro e opacidade reduzida para banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#071427"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.36" r="0.58">
      <stop offset="0" stop-color="#2f6ecf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f6ecf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.2" filter="url(#blurSoft)">
    <circle cx="290" cy="180" r="140" fill="#72c3ff"/>
    <circle cx="1280" cy="760" r="180" fill="#3fb77d"/>
  </g>

  <g transform="translate(360 210)" opacity="0.34">
    <rect x="0" y="0" width="880" height="480" rx="42" fill="#f4f8ff"/>
    <rect x="0" y="0" width="880" height="112" rx="42" fill="#1a5ab9"/>
    <text x="440" y="72" text-anchor="middle" fill="#ffffff" font-size="56" font-family="Arial, Helvetica, sans-serif" letter-spacing="6">BRASIL</text>
    <text x="440" y="285" text-anchor="middle" fill="#0b1220" font-size="176" font-family="Arial Black, Arial, Helvetica, sans-serif" letter-spacing="20">ABC1D23</text>
    <text x="440" y="390" text-anchor="middle" fill="#1a5ab9" font-size="72" font-family="Arial, Helvetica, sans-serif" letter-spacing="10">MERCOSUL</text>
    <circle cx="86" cy="56" r="13" fill="#ffffff"/>
    <circle cx="794" cy="56" r="13" fill="#ffffff"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="#040912" fill-opacity="0.26"/>
</svg>
